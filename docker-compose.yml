name: nit

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nit
      POSTGRES_PASSWORD: nit
      POSTGRES_DB: nit
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nit -d nit"]
      interval: 2s
      timeout: 3s
      retries: 30

  # minio образы больше не выкладывает, поэтому seaweedfs. апи обычный s3
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=8
    ports:
      - "127.0.0.1:9010:8333"
    volumes:
      - s3-data:/data
      - ./backend/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  db-data:
  s3-data:
