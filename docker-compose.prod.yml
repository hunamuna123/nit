name: nit-prod

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}
      POSTGRES_DB: nit
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nit -d nit"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=8
    volumes:
      - s3-data:/data
      - ./backend/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 512m
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://nit:${POSTGRES_PASSWORD}@db:5432/nit
      S3_ENDPOINT: s3:8333
      DEBUG: "false"
      # торч иначе жрет все ядра хоста
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - models:/models
    cpus: 2
    mem_limit: 3g
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?нужен SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    mem_limit: 256m
    restart: unless-stopped

volumes:
  db-data:
  s3-data:
  models:
  caddy-data:
  caddy-config:
