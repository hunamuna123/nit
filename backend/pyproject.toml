[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend"
readme = "README.md"
authors = [
    { name = "hunamuna123", email = "markdinin7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "certifi>=2026.10.23",
    "email-validator>=2.4.0",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "numpy>=1.26,<2",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "torch>=2.15.0",
    "transformers>=5.24.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
